name: Release

# Tag-driven release, after Calamo's and Orecchiante's release.yml: pushing a tag like v0.3.0 runs
# the tests, packs the extension (tools/pack-extension.ps1: Shosa.Lsp and the `shosa` CLI published
# self-contained for win-x64 into its server folder, `vsce package --target win32-x64`), attaches
# the .vsix to a GitHub Release whose text is the top section of editors/vscode/CHANGELOG.md, and
# publishes it to the VS Code Marketplace.
#
# Run by hand (workflow_dispatch) it only tests and packs, and keeps the .vsix as a workflow
# artifact: no Release, no Marketplace. Do that once before the first tag, so that the runner is
# proven before a version is spent -- THE MARKETPLACE NEVER ACCEPTS A VERSION TWICE.
#
# Run by hand with publish_targets (win32-x64) it publishes that target of the current version
# from its GitHub Release instead: the way to finish a release the Marketplace did not list.
#
# One target (win32-x64): the other platforms package but have never been run (DESIGN.md 45.2).
#
# Secret: VSCE_PAT, the same token as Lily#'s and Calamo's: a Marketplace -> Manage token of the
# Microsoft account that OWNS the publisher `yotsuda`, made at https://dev.azure.com/ -> User
# settings -> Personal access tokens, organization "All accessible organizations", scope
# Marketplace: Manage. It expires 2027-10-16 (Calamo's release.yml): when a release fails at
# "Publish rights", renew it and update the secret in every repository that has it
# (Settings -> Secrets and variables -> Actions).
#
# Only a tag pushed by the owner or a run by hand starts this workflow, so the secret never reaches
# a fork's pull request.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      publish_targets:
        description: 'Finish a release: targets to publish from the GitHub Release (win32-x64). Empty: test and pack only.'
        required: false
        default: ''

permissions:
  contents: write   # create the GitHub Release + upload the .vsix

jobs:
  vsix:
    if: github.event.inputs.publish_targets == ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tag matches the version
        # v0.3.0 must be editors/vscode/package.json's 0.3.0. The version is not rewritten from the
        # tag: a wrong tag is a mistake to stop on.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          $pkg = (Get-Content editors/vscode/package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) { throw "tag $env:GITHUB_REF_NAME, editors/vscode/package.json $pkg : make them one before tagging" }
          $top = Select-String -Path editors/vscode/CHANGELOG.md -Pattern '^## ' | Select-Object -First 1
          if ($top.Line -notmatch "^## $([regex]::Escape($pkg))\b") { throw "the top section of editors/vscode/CHANGELOG.md is '$($top.Line)', not $pkg" }
          "version $pkg"

      - name: Publish rights
        # One request before the build: a wrong or expired PAT fails here, not after the pack.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          $publisher = (Get-Content editors/vscode/package.json -Raw | ConvertFrom-Json).publisher
          npx --yes @vscode/vsce verify-pat $publisher
          if ($LASTEXITCODE -ne 0) { throw "verify-pat failed for '$publisher': nothing was published" }

      - name: Lily#'s lysc
        # The tests that dance to a song read it with Lily#'s lysc (as ci.yml): that of Lily#'s latest release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo yotsuda/LilySharp --pattern 'lysc-*-win-x64.zip' --dir "$env:RUNNER_TEMP/lysc-zip"
          if ($LASTEXITCODE -ne 0) { throw "no lysc in Lily#'s latest release" }
          Expand-Archive (Get-ChildItem "$env:RUNNER_TEMP/lysc-zip/*.zip").FullName "$env:RUNNER_TEMP/lysc"
          "SHOSA_LYSC=$env:RUNNER_TEMP\lysc\lysc.exe" >> $env:GITHUB_ENV
          & "$env:RUNNER_TEMP\lysc\lysc.exe" --version

      - name: Test
        run: |
          dotnet test Shosa.slnx -c Release
          if ($LASTEXITCODE -ne 0) { throw 'the tests failed' }
          Push-Location editors/vscode
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "the extension's tests failed" }
          Pop-Location

      - name: Pack
        # The same script the local deploy uses.
        run: pwsh -NoProfile -File tools/pack-extension.ps1 -Out "$PWD/out/extension"

      - name: Keep the .vsix
        uses: actions/upload-artifact@v4
        with:
          name: shosa-vsix
          path: out/extension/*.vsix
          if-no-files-found: error

      - name: Extract release notes
        # The topmost section of editors/vscode/CHANGELOG.md is the version being tagged (the
        # Marketplace shows the same file on its Changelog tab). The heading is dropped: the
        # Release is already titled with the tag.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $n = 0
          $notes = foreach ($line in Get-Content editors/vscode/CHANGELOG.md) {
            if ($line -match '^## ') { $n++; continue }
            if ($n -eq 1) { $line }
          }
          Set-Content RELEASE_NOTES.md ($notes -join "`n")
          Get-Content RELEASE_NOTES.md

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: out/extension/*.vsix

      - name: Publish to VS Code Marketplace
        # The packed .vsix as it is (its target is inside it), no --pre-release. The script waits
        # for the Marketplace to list it, and leaves a version already listed alone.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: ./tools/publish-marketplace.ps1 -Vsix (Get-ChildItem out/extension/*.vsix).FullName

  finish:
    # By hand, with publish_targets: the very files the GitHub Release holds.
    if: github.event.inputs.publish_targets != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish rights
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          $publisher = (Get-Content editors/vscode/package.json -Raw | ConvertFrom-Json).publisher
          npx --yes @vscode/vsce verify-pat $publisher
          if ($LASTEXITCODE -ne 0) { throw "verify-pat failed for '$publisher': nothing was published" }

      - name: Publish the targets from the Release
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TARGETS: ${{ github.event.inputs.publish_targets }}
        run: |
          $version = (Get-Content editors/vscode/package.json -Raw | ConvertFrom-Json).version
          $files = foreach ($target in $env:PUBLISH_TARGETS -split '[,\s]+' | Where-Object { $_ }) {
            $name = "shosa-$target-$version.vsix"
            gh release download "v$version" --pattern $name --dir release-vsix
            if ($LASTEXITCODE -ne 0) { throw "no $name in the release v$version" }
            "release-vsix/$name"
          }
          ./tools/publish-marketplace.ps1 -Vsix $files
