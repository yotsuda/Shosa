name: CI

# Every push and pull request: the compiler's tests (dotnet test) and the extension's (npm test),
# with the type check of the extension (npm run check). Windows, as the release is packed there
# (release.yml) and the one platform the extension is published for.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Lily#'s lysc
        # The tests that dance to a song read it with Lily#'s lysc (SongReader: SHOSA_LYSC first). The
        # runner has no Lily# extension, so the lysc of Lily#'s latest GitHub Release is fetched.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo yotsuda/LilySharp --pattern 'lysc-*-win-x64.zip' --dir "$env:RUNNER_TEMP/lysc-zip"
          if ($LASTEXITCODE -ne 0) { throw "no lysc in Lily#'s latest release" }
          Expand-Archive (Get-ChildItem "$env:RUNNER_TEMP/lysc-zip/*.zip").FullName "$env:RUNNER_TEMP/lysc"
          "SHOSA_LYSC=$env:RUNNER_TEMP\lysc\lysc.exe" >> $env:GITHUB_ENV
          & "$env:RUNNER_TEMP\lysc\lysc.exe" --version

      - name: dotnet test
        run: dotnet test Shosa.slnx -c Release

      - name: npm ci
        working-directory: editors/vscode
        run: npm ci

      - name: Type check
        working-directory: editors/vscode
        run: npm run check

      - name: npm test
        working-directory: editors/vscode
        run: npm test
