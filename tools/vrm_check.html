<!doctype html>
<!--
  Puts a .vrma written by `shosa vrma` on a VRM model, with three-vrm, to see the movement on a skinned mesh.
  Serve the repository over HTTP (a page opened from a file cannot fetch the model), then:

    py -m http.server 8377 --bind 127.0.0.1 --directory C:\MyProj\Shosa
    http://localhost:8377/tools/vrm_check.html?vrm=/out/vrm/sample.vrm&vrma=/out/kick.vrma              plays; drag to look around
    http://localhost:8377/tools/vrm_check.html?vrm=/out/vrm/sample.vrm&vrma=/out/kick.vrma&t=0,0.9,1.7  those seconds side by side
    ...&view=side   from the figure's left instead of the front

  The libraries come from a CDN, so this needs the network.
-->
<meta charset="utf-8">
<title>Shosa: a .vrma on a VRM model</title>
<style>
  body { margin: 0; background: #e6e6e6; font: 13px sans-serif; overflow: hidden; }
  #info { position: fixed; left: 8px; top: 6px; white-space: pre; }
</style>
<div id="info">loading…</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js",
    "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3/lib/three-vrm-animation.module.min.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from '@pixiv/three-vrm-animation';

const info = document.getElementById('info');
const params = new URLSearchParams(location.search);
const times = params.get('t')?.split(',').map(Number);
const side = params.get('view') === 'side';

try {
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0xe6e6e6);
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 2);
  sun.position.set(1, 3, 2);
  scene.add(sun);
  scene.add(new THREE.GridHelper(20, 40, 0x999999, 0xcccccc));

  const loader = new GLTFLoader();
  loader.register(parser => new VRMLoaderPlugin(parser));
  loader.register(parser => new VRMAnimationLoaderPlugin(parser));

  const vrm = (await loader.loadAsync(params.get('vrm'))).userData.vrm;
  VRMUtils.rotateVRM0(vrm);
  vrm.scene.traverse(o => { o.frustumCulled = false; });
  scene.add(vrm.scene);

  const animation = (await loader.loadAsync(params.get('vrma'))).userData.vrmAnimations[0];
  const clip = createVRMAnimationClip(animation, vrm);
  const mixer = new THREE.AnimationMixer(vrm.scene);
  mixer.clipAction(clip).play();

  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  const hips = vrm.humanoid.getNormalizedBoneNode('hips');
  const offset = side ? new THREE.Vector3(5, 0.3, 0.6) : new THREE.Vector3(1.4, 0.3, 4.8);
  const aim = () => {
    const at = hips.getWorldPosition(new THREE.Vector3());
    at.y = 0.85;
    camera.position.copy(at).add(offset);
    camera.lookAt(at);
  };
  const pose = seconds => {
    mixer.setTime(Math.min(seconds, clip.duration - 1e-4));
    vrm.update(0);
    vrm.scene.updateMatrixWorld(true);
  };

  if (times) {
    // Stills, side by side: the same thing as the contact sheet, on a mesh.
    const draw = () => {
      renderer.setSize(innerWidth, innerHeight);
      renderer.setScissorTest(true);
      const w = innerWidth / times.length;
      camera.aspect = w / innerHeight;
      camera.updateProjectionMatrix();
      times.forEach((t, i) => {
        pose(t);
        aim();
        renderer.setViewport(i * w, 0, w, innerHeight);
        renderer.setScissor(i * w, 0, w, innerHeight);
        renderer.render(scene, camera);
      });
    };
    draw();
    addEventListener('resize', draw);
    info.textContent = `${params.get('vrma')}  ${clip.duration.toFixed(2)} s  at ${times.join(', ')} s  (${side ? 'from its left' : 'from the front'})`;
  } else {
    const controls = new OrbitControls(camera, renderer.domElement);
    aim();
    controls.target.set(camera.position.x - offset.x, 0.85, camera.position.z - offset.z);
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = clock.getDelta();
      mixer.update(dt);
      vrm.update(dt);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      controls.update();
      renderer.render(scene, camera);
    });
    info.textContent = `${params.get('vrma')}  ${clip.duration.toFixed(2)} s`;
  }
  document.title = 'ready';
} catch (error) {
  info.textContent = 'failed: ' + (error.stack ?? error);
  document.title = 'failed';
}
</script>
