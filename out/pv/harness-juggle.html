<!doctype html>
<!-- Where the preview draws each ball (DESIGN.md 118): ?clip= a `shosa clip` JSON, ?base= the folder of the .shosa from the
     repository root, ?from=&to= the beats. Steps the seek bar one step at a time and posts what juggle.js reports as JSON to /done. -->
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:;">
<body class="vscode-light" style="--vscode-editor-background:#ffffff">
<script>
const params = new URLSearchParams(location.search);
const wait = ms => new Promise(r => setTimeout(r, ms));
const seen = [];
globalThis.shosaJuggleDebug = (...row) => seen.push(row);
window.acquireVsCodeApi = () => ({
  getState: () => undefined,
  setState: () => undefined,
  postMessage: async m => {
    if (m.type !== 'ready') return;
    const clip = await (await fetch(params.get('clip'))).json();
    const base = new URL(params.get('base') + '/', location.origin + '/');
    const models = {};
    for (const f of clip.figures) if (f.model) models[f.model] = new URL(f.model, base).pathname;
    window.postMessage({ type: 'clip', clips: [clip], models, offset: -1, reset: true }, '*');
    for (const file of new Set(Object.values(models))) {
      const bytes = new Uint8Array(await (await fetch(file)).arrayBuffer());
      window.postMessage({ type: 'model', file, data: bytes }, '*');
    }
    await wait(8000);
    const seek = document.getElementById('seek');
    const from = Math.round(1000 * Number(params.get('from')) / clip.totalBeats), to = Math.round(1000 * Number(params.get('to')) / clip.totalBeats);
    for (let v = from; v <= to; v++) {
      seen.length = 0;
      seek.value = String(v);
      seek.dispatchEvent(new Event('input'));
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      globalThis.juggleLog = (globalThis.juggleLog ?? []).concat(seen.slice(-clip.figures[0].juggle.count));
    }
    await fetch('/done', { method: 'POST', body: JSON.stringify(globalThis.juggleLog) });
  },
});
window.addEventListener('error', e => fetch('/log', { method: 'POST', body: 'error: ' + e.message + ' ' + e.filename + ':' + e.lineno }));
</script>
<script src="/editors/vscode/dist/preview.js"></script>
</body>
